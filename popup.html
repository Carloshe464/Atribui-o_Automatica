<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 330px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 13px; margin: 0 0 10px; }
  #gate {
    font-size: 12px; margin-bottom: 10px; padding: 9px 10px; border-radius: 8px;
    background: color-mix(in srgb, CanvasText 7%, Canvas); line-height: 1.35;
  }
  #gate.good { background: color-mix(in srgb, #2b8a3e 15%, Canvas); }
  #gate.bad  { background: color-mix(in srgb, #d4593a 15%, Canvas); }
  #gate b {
    display: block; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; opacity: .55; margin-bottom: 2px; font-weight: 600;
  }
  .card {
    border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    border-radius: 8px; padding: 9px 10px; margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 3px; }
  .row > span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .muted { opacity: .6; font-size: 11.5px; }
  .muted > span:last-child { font-weight: 500 !important; }
  label { display: block; margin-bottom: 9px; }
  label > span { display: block; margin-bottom: 3px; }
  input[type=text], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: 5px 7px;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    border-radius: 6px; background: Field; color: FieldText; font: inherit;
  }
  .check { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .check input { margin: 0; }
  .check label { margin: 0; }
  button {
    width: 100%; padding: 7px; border-radius: 6px; font: inherit; cursor: pointer;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    background: color-mix(in srgb, CanvasText 8%, Canvas); color: CanvasText;
  }
  button.primary { background: #03363d; color: #fff; border-color: #03363d; }
  hr { border: 0; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); margin: 12px 0; }
  details summary { cursor: pointer; font-size: 12px; opacity: .8; }
  details > *:not(summary) { margin-top: 8px; }
  #msg { margin-top: 8px; font-size: 11.5px; min-height: 14px; opacity: .8; }
</style>
</head>
<body>
  <h1>Zendesk — Auto-Atribuição</h1>

  <div id="gate"><b>Situação</b><span id="gate-text">conectando…</span></div>

  <div class="card">
    <div class="row"><span>Meus chats</span><span id="s-mine">–</span></div>
    <div class="row"><span>Esperando na fila</span><span id="s-queue">–</span></div>
    <div class="row muted"><span>painel / abas / barra</span><span id="s-sources">–</span></div>
    <div class="row muted"><span id="s-note"></span><span></span></div>
  </div>

  <div class="check">
    <input type="checkbox" id="enabled">
    <label for="enabled"><b>Puxar chat automaticamente</b></label>
  </div>

  <label>
    <span>Limite de chats simultâneos</span>
    <input type="number" id="maxChats" min="1" max="20" step="1">
  </label>

  <label>
    <span>Alertar após (minutos sem resposta)</span>
    <input type="number" id="idleMinutes" min="1" max="60" step="1">
  </label>

  <label>
    <span>Contar meus chats por</span>
    <select id="countSource">
      <option value="auto">Automático — painel, abas, depois barra</option>
      <option value="panel">Painel de conversas</option>
      <option value="tabs">Abas de ticket abertas no topo</option>
      <option value="bar">Contador do botão "Conversas"</option>
    </select>
  </label>

  <button class="primary" id="save">Salvar</button>
  <div id="msg"></div>

  <hr>

  <details>
    <summary>Avançado</summary>

    <label>
      <span>Como puxar</span>
      <select id="serveMethod">
        <option value="auto">Automático — botão, senão atalho</option>
        <option value="shortcut">Só o atalho</option>
        <option value="button">Só o botão "Conversas"</option>
      </select>
    </label>

    <label>
      <span>Atalho</span>
      <input type="text" id="shortcut" placeholder="Ctrl+Alt+Q">
    </label>

    <div class="check">
      <input type="checkbox" id="beep">
      <label for="beep">Som no alerta de silêncio</label>
    </div>

    <div class="check">
      <input type="checkbox" id="debug">
      <label for="debug">Log no console da página</label>
    </div>

    <button id="diag">Copiar diagnóstico</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
